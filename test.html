<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dual Chart Example</title>
  <style>
    body {
      background-color: #800000;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    canvas {
      background: #800000;
      margin-bottom: 50px;
    }
  </style>
</head>
<body>
  <h2>Line Chart</h2>
  <canvas id="lineChart"></canvas>

  <h2>Bar Chart</h2>
  <canvas id="barChart"></canvas>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    $(document).ready(function () {
      const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'June'];

      const data = {
        labels,
        datasets: [
          {
            label: 'Conversion Rate',
            data: [5, 10, 40, 35, 25, 50],
            borderColor: '#f9a825',
            backgroundColor: '#f9a825',
            fill: false,
            tension: 0.4
          },
          {
            label: 'Website Traffic',
            data: [10, 5, 20, 15, 40, 70],
            borderColor: '#ffffff',
            backgroundColor: '#ffffff',
            fill: false,
            tension: 0.4
          },
          {
            label: 'Overall Sales',
            data: [15, 30, 25, 40, 45, 120],
            borderColor: '#8b3e2f',
            backgroundColor: '#8b3e2f',
            fill: false,
            tension: 0.4
          }
        ]
      };

      const configLine = {
        type: 'line',
        data,
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: '#fff'
              }
            }
          },
          scales: {
            x: {
              ticks: { color: '#fff' }
            },
            y: {
              ticks: { color: '#fff' },
              beginAtZero: true
            }
          }
        }
      };

      const configBar = {
        type: 'bar',
        data,
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: '#fff'
              }
            }
          },
          scales: {
            x: {
              ticks: { color: '#fff' }
            },
            y: {
              ticks: { color: '#fff' },
              beginAtZero: true
            }
          }
        }
      };

      new Chart(document.getElementById('lineChart'), configLine);
      new Chart(document.getElementById('barChart'), configBar);
    });
  </script>
</body>
</html>
